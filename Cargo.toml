[workspace]
members = ["min-client/src-tauri", "min-server"]
exclude = [
  "AEADs",
  "axum",
  "rusqlite",
  "signatures",
  "snow",
  "sqlx",
  "tauri",
  "tokio",
  "tokio-tungstenite",
  "tonic",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
authors = ["min contributors"]
homepage = "https://github.com/oskarlolpocursor9/min"
license = "MIT"
repository = "https://github.com/oskarlolpocursor9/min"
categories = ["gui", "network-programming", "cryptography"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Local library checkouts supplied with this project.
aes-gcm = { path = "AEADs/aes-gcm" }
axum = { path = "axum/axum", features = ["ws", "json"] }
rusqlite = { path = "rusqlite", features = ["bundled"] }
snow = { path = "snow" }
sqlx = { path = "sqlx", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json"] }
tauri = { path = "tauri/crates/tauri", features = ["wry"] }
tauri-build = { path = "tauri/crates/tauri-build" }
tokio = { path = "tokio/tokio", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
tokio-tungstenite = { path = "tokio-tungstenite", features = ["connect"] }
